<style>
/* Layout: app de una columna para celular; cabecera tipo letrero de mina, buscador arriba, barra inferior fija con 4 destinos. */
:root{
  --bg:#eef0ec; --surface:#fbfbf8; --surface-2:#e3e7e1; --ink:#1b2422; --muted:#5a6661; --line:#cfd5ce;
  --ore:#9a6f0c; --ore-soft:#f3e7c6; --rock:#1d2a2c; --on-rock:#f1efe6;
  --safe:#c2410c; --safe-soft:#fde3d3; --ok:#2f7a4a; --ok-soft:#dcefe2; --warn:#a15c00;
  --f-display:"Barlow Condensed","Arial Narrow",Roboto Condensed,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121817; --surface:#1a2221; --surface-2:#232d2b; --ink:#e8ebe5; --muted:#9aa7a1; --line:#2f3b39;
  --ore:#e0b347; --ore-soft:#3a3018; --rock:#0c1110; --on-rock:#f1efe6;
  --safe:#fb8a4c; --safe-soft:#3f2416; --ok:#6cc58c; --ok-soft:#173023; --warn:#f0a43a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1a2221; --surface-2:#232d2b; --ink:#e8ebe5; --muted:#9aa7a1; --line:#2f3b39;
  --ore:#e0b347; --ore-soft:#3a3018; --rock:#0c1110; --on-rock:#f1efe6;
  --safe:#fb8a4c; --safe-soft:#3f2416; --ok:#6cc58c; --ok-soft:#173023; --warn:#f0a43a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ore)}
:focus-visible{outline:3px solid var(--ore);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
header.top{background:var(--rock);color:var(--on-rock);margin-inline:-16px;padding:14px 16px 18px;display:grid;gap:12px}
@media (min-width:792px){header.top{border-radius:0 0 var(--r) var(--r)}}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.65rem;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;letter-spacing:.12em;opacity:.75;margin-top:4px}
.net{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.net.on{color:#8fd8a6}.net.off{color:#f6c46b}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:0;border-radius:var(--r);padding:12px 14px;background:var(--on-rock);color:#1b2422;font-size:1rem}
.search button{border:0;border-radius:var(--r);padding:0 16px;background:var(--ore);color:#fff;font-weight:600}
:root[data-theme="dark"] .search button{color:#1b1406}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .search button{color:#1b1406}}
main{display:grid;gap:18px;padding-top:18px}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
h2.view{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.lede{color:var(--muted);max-width:62ch}
.alert{background:var(--safe-soft);border-left:4px solid var(--safe);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;display:grid;gap:4px}
.alert b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--safe)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;min-height:96px;align-content:start}
.tile:hover{border-color:var(--ore)}
.tile .k{font-family:var(--f-display);font-weight:600;font-size:1.2rem;line-height:1.15}
.tile .n{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.ssoma{grid-column:1/-1;background:var(--safe-soft);border-color:transparent;min-height:0}
.tile.ssoma .k{color:var(--safe);font-size:1.45rem}
.list{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:grid;gap:2px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:600}
.row .d{font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-right:6px;vertical-align:middle}
.tag.s{background:var(--safe-soft);color:var(--safe)}
.tag.o{background:var(--ore-soft);color:var(--ore)}
.tag.d{background:var(--ok-soft);color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.answer{border-color:var(--ore);border-width:2px}
.answer .label{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ore)}
ol.steps,ul.pts{margin:0;padding-left:1.3em;display:grid;gap:6px}
ol.steps li::marker{font-family:var(--f-display);font-weight:700;color:var(--ore)}
.formula{display:grid;gap:4px;padding:10px 12px;background:var(--surface-2);border-radius:8px;min-width:0}
.formula code{font-family:var(--f-mono);font-size:.84rem;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.formula span{font-size:.88rem;color:var(--muted)}
.risk{display:grid;gap:4px;border-left:3px solid var(--safe);padding-left:12px}
.risk b{color:var(--safe)}
blockquote{margin:0;padding:10px 12px;background:var(--ore-soft);border-radius:8px}
.src{font-size:.8rem;color:var(--muted)}
.src a{color:inherit}
.conf{font-size:.8rem;font-weight:600;color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.back{justify-self:start;border:0;background:none;color:var(--ore);font-weight:600;padding:4px 0;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--rock);color:var(--on-rock);border-color:var(--rock)}
.field{display:grid;gap:4px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.result{display:grid;gap:4px;padding:12px 14px;border-radius:8px;background:var(--ore-soft)}
.result .big{font-family:var(--f-display);font-weight:700;font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.1}
.result.ok{background:var(--ok-soft)} .result.bad{background:var(--safe-soft)}
.btn{border:0;border-radius:8px;padding:11px 16px;background:var(--rock);color:var(--on-rock);font-weight:600;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--safe);color:var(--safe)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;justify-items:start}
.thumb{width:100%;max-height:260px;object-fit:contain;border-radius:8px;background:var(--surface-2)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.empty{padding:16px;color:var(--muted)}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.bar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.bar button{border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted);cursor:pointer}
nav.bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.bar button[aria-current="page"]{color:var(--ore)}
nav.bar button.s[aria-current="page"]{color:var(--safe)}
mark{background:var(--ore-soft);color:inherit;padding:0 2px;border-radius:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--rock);color:var(--on-rock);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.tile,.row{transition:border-color .15s,background .15s}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Asistente Minero<small>Perú · subterránea · SSOMA</small></h1>
      <span id="net" class="net off">Sin conexión</span>
    </div>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Pregunta o busca: PETAR, ley diluida, desatado…" autocomplete="off" aria-label="Buscar en la base de conocimiento">
      <button type="submit">Buscar</button>
    </form>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="bar" aria-label="Secciones">
  <div class="in">
    <button data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-go="ssoma" class="s"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M2 15h20v2H2z"/><path d="M12 7V4"/><path d="M9 8l-1-3M15 8l1-3"/></svg>SSOMA</button>
    <button data-go="calc"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>Calcular</button>
    <button data-go="docs"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>Mis docs</button>
  </div>
</nav>

<script type="application/json" id="kb">__KB__</script>
<script>
"use strict";
const KB = JSON.parse(document.getElementById("kb").textContent);
const $ = (s, r = document) => r.querySelector(s);
const view = $("#view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const fmt = (n, d = 2) => Number.isFinite(n) ? n.toLocaleString("es-PE", {maximumFractionDigits: d, minimumFractionDigits: 0}) : "—";

function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ---------- estado de red ---------- */
function updNet(){ const on = navigator.onLine, n = $("#net"); n.textContent = on ? "Con conexión" : "Sin conexión"; n.className = "net " + (on ? "on" : "off"); }
addEventListener("online", updNet); addEventListener("offline", updNet); updNet();

/* ---------- secciones ---------- */
const SECTIONS = [
  {key: "ssoma", name: "Seguridad y SSOMA", desc: "IPERC, PETAR, PETS, riesgos críticos, ventilación, emergencias", items: KB.ssoma},
  {key: "glosario", name: "Glosario", desc: "Términos de la minería peruana", items: KB.glosario},
  {key: "procesos", name: "Procesos", desc: "Ciclo de minado, voladura, planta, mantenimiento", items: KB.procesos},
  {key: "logistica", name: "Logística", desc: "Flota, inventario, combustible, explosivos", items: KB.logistica},
  {key: "economia", name: "CAPEX y OPEX", desc: "Costos unitarios, VAN, ley de corte", items: KB.economia},
  {key: "faq", name: "Preguntas frecuentes", desc: "Respuestas rápidas", items: KB.faq},
  {key: "referencias_empresa", name: "Empresa de referencia", desc: "Consorcio Minero Horizonte", items: KB.referencias_empresa},
];
const secBy = Object.fromEntries(SECTIONS.map(s => [s.key, s]));
const CAT = {seguridad: "Seguridad", medio_ambiente: "Medio ambiente", planeamiento: "Planeamiento", operaciones: "Operaciones", geologia: "Geología", procesamiento: "Planta", economia: "Economía", logistica: "Logística"};

/* ---------- documentos (IndexedDB) ---------- */
const DB = {
  db: null,
  open(){ return new Promise((res) => { try { const r = indexedDB.open("asistente-minero", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("docs", {keyPath: "id"});
    r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); } catch(e){ res(false); } }); },
  tx(mode){ return this.db.transaction("docs", mode).objectStore("docs"); },
  all(){ return new Promise(res => { if(!this.db) return res([]); try { const r = this.tx("readonly").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); } catch(e){ res([]); } }); },
  put(d){ return new Promise((res, rej) => { try { const r = this.tx("readwrite").put(d); r.onsuccess = () => res(); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }); },
  del(id){ return new Promise(res => { try { const r = this.tx("readwrite").delete(id); r.onsuccess = () => res(); r.onerror = () => res(); } catch(e){ res(); } }); },
};
let DOCS = [];
async function loadDocs(){ DOCS = await DB.all(); DOCS.sort((a, b) => b.fecha - a.fecha); }

/* ---------- índice de búsqueda ---------- */
const STOP = new Set("que de la el los las un una y o en por para con como es del al se lo su sus cual cuales cuando donde mi me hago hacer debo puedo hay sobre entre a e".split(" "));
function textOf(x){
  const parts = [x.termino, x.titulo, x.pregunta, x.definicion, x.contenido, x.resumen, x.respuesta, ...(x.sinonimos||[]), ...(x.pasos||[]), ...(x.puntos||[]), ...(x.notas||[]), ...(x.consejos||[]), ...(x.indicadores||[])];
  (x.formulas||[]).forEach(f => parts.push(f.nombre, f.expresion, f.interpretacion));
  (x.riesgos||[]).forEach(r => parts.push(r.riesgo, ...r.controles));
  (x.tabla||[]).forEach(r => parts.push(r.concepto, r.rango));
  return parts.filter(Boolean).join(" ");
}
let INDEX = [];
function buildIndex(){
  INDEX = [];
  for (const s of SECTIONS) s.items.forEach((x, i) => INDEX.push({sec: s.key, i, head: norm(x.termino || x.titulo || x.pregunta), syn: norm((x.sinonimos||[]).join(" ")), body: norm(textOf(x)), item: x}));
  DOCS.forEach(d => INDEX.push({sec: "docs", id: d.id, head: norm(d.nombre + " " + (d.titulo||"")), syn: norm(d.etiquetas||""), body: norm((d.notas||"") + " " + (d.texto||"")), item: d}));
}
function search(q){
  const nq = norm(q).trim(); if (!nq) return [];
  const toks = nq.split(/[^a-z0-9ñ%]+/).filter(t => t && (t.length > 1 || /\d/.test(t)) && !STOP.has(t));
  if (!toks.length) return [];
  const res = [];
  for (const e of INDEX){
    let sc = 0, hits = 0;
    if (e.head === nq) sc += 40;
    else if (e.head.startsWith(nq)) sc += 18;
    if (nq.length > 3 && e.body.includes(nq)) sc += 8;
    for (const t of toks){
      let h = false;
      if (new RegExp("\\b" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(e.head)) { sc += 9; h = true; }
      if (e.syn.includes(t)) { sc += 6; h = true; }
      const m = e.body.split(t).length - 1; if (m) { sc += Math.min(m, 4); h = true; }
      if (h) hits++;
    }
    if (!hits) continue;
    sc *= hits / toks.length;
    if (e.sec === "ssoma") sc *= 1.15;
    if (e.sec === "faq" && toks.length > 2) sc *= 1.2;
    res.push({e, sc});
  }
  return res.sort((a, b) => b.sc - a.sc).slice(0, 12);
}
function snippet(e, q){
  const x = e.item; return x.definicion || x.respuesta || x.contenido || x.resumen || x.notas || (x.texto||"").slice(0, 220) || "";
}
function hl(s, q){
  const toks = norm(q).split(/\s+/).filter(t => t.length > 2 && !STOP.has(t));
  let out = esc(s); if (!toks.length) return out;
  const n = norm(out);
  const marks = [];
  toks.forEach(t => { let i = 0; while ((i = n.indexOf(t, i)) !== -1){ marks.push([i, i + t.length]); i += t.length; } });
  if (!marks.length) return out;
  marks.sort((a, b) => a[0] - b[0]);
  let r = "", p = 0; for (const [a, b] of marks){ if (a < p) continue; r += out.slice(p, a) + "<mark>" + out.slice(a, b) + "</mark>"; p = b; }
  return r + out.slice(p);
}

/* ---------- render de fichas ---------- */
function srcHtml(ids){
  if (!ids || !ids.length) return "";
  return '<p class="src">Fuente: ' + ids.map(id => { const f = KB.fuentes[id]; if (!f) return esc(id); return f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titulo)}</a>` : esc(f.titulo); }).join(" · ") + "</p>";
}
function fichaHtml(x){
  let h = "";
  const txt = x.definicion || x.contenido || x.resumen || x.respuesta;
  if (txt) h += `<p>${esc(txt)}</p>`;
  if (x.sinonimos && x.sinonimos.length) h += `<p class="small muted">También: ${esc(x.sinonimos.join(", "))}</p>`;
  if (x.confianza) h += `<p class="conf">Dato referencial: ${esc(x.confianza)}</p>`;
  if (x.pasos) h += `<ol class="steps">${x.pasos.map(p => `<li>${esc(p)}</li>`).join("")}</ol>`;
  if (x.puntos) h += `<ul class="pts">${x.puntos.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  if (x.riesgos) h += x.riesgos.map(r => `<div class="risk"><b>${esc(r.riesgo)}</b><ul class="pts">${r.controles.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>`).join("");
  if (x.formulas) h += x.formulas.map(f => `<div class="formula"><strong>${esc(f.nombre)}</strong><code>${esc(f.expresion)}</code>${f.interpretacion ? `<span>${esc(f.interpretacion)}</span>` : ""}</div>`).join("");
  if (x.tabla) h += `<div class="tw"><table><thead><tr><th>Concepto</th><th>Rango</th></tr></thead><tbody>${x.tabla.map(r => `<tr><td>${esc(r.concepto)}</td><td>${esc(r.rango)}</td></tr>`).join("")}</tbody></table></div>`;
  if (x.notas) h += `<ul class="pts">${x.notas.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
  if (x.indicadores) h += `<p><b>Indicadores:</b> ${esc(x.indicadores.join("; "))}</p>`;
  if (x.consejos) h += x.consejos.map(c => `<blockquote>${esc(c)}</blockquote>`).join("");
  h += srcHtml(x.fuentes || (x.fuente ? [x.fuente] : []));
  return h;
}
const titleOf = x => x.termino || x.titulo || x.pregunta;

/* ---------- navegación ---------- */
let current = {v: "home"};
function go(state, push = true){
  current = state;
  if (push) { try { history.pushState(state, ""); } catch(e){} }
  render(); scrollTo(0, 0);
  document.querySelectorAll("nav.bar button").forEach(b => b.setAttribute("aria-current", (b.dataset.go === tabOf(state)) ? "page" : "false"));
}
function tabOf(s){ if (s.v === "sec" && s.sec === "ssoma") return "ssoma"; if (s.v === "item" && s.sec === "ssoma") return "ssoma"; if (s.v === "calc" || s.v === "calcitem") return "calc"; if (s.v === "docs" || s.v === "doc") return "docs"; if (s.v === "home") return "home"; return ""; }
addEventListener("popstate", e => { go(e.state || {v: "home"}, false); });
document.querySelectorAll("nav.bar button").forEach(b => b.addEventListener("click", () => {
  const g = b.dataset.go; go(g === "ssoma" ? {v: "sec", sec: "ssoma"} : {v: g});
}));
$("#searchForm").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) go({v: "search", q}); });
const backBtn = () => `<button class="back" onclick="history.length > 1 ? history.back() : go({v:'home'})">← Volver</button>`;

function render(){
  const s = current;
  if (s.v === "home") return renderHome();
  if (s.v === "search") return renderSearch(s.q);
  if (s.v === "sec") return renderSection(s.sec);
  if (s.v === "item") return renderItem(s.sec, s.i);
  if (s.v === "calc") return renderCalcs();
  if (s.v === "calcitem") return renderCalc(s.id);
  if (s.v === "docs") return renderDocs();
  if (s.v === "doc") return renderDoc(s.id);
}

function renderHome(){
  const tiles = SECTIONS.map(s => `<button class="tile ${s.key === "ssoma" ? "ssoma" : ""}" onclick="go({v:'sec',sec:'${s.key}'})"><span class="k">${esc(s.name)}</span><span class="n">${s.items.length} ${s.key === "glosario" ? "términos" : s.key === "faq" ? "preguntas" : (s.items.length === 1 ? "ficha" : "fichas")} · ${esc(s.desc)}</span></button>`).join("");
  const tip = KB.ssoma.find(x => x.id === "riesgos-criticos-subterranea");
  view.innerHTML = `
    <div class="alert"><b>Antes de empezar la guardia</b><p>Desatado, IPERC continuo y verificación de gases. Ninguna tarea empieza sin estos tres controles.</p></div>
    <h2 class="sec">Consultar</h2>
    <div class="grid">${tiles}
      <button class="tile" onclick="go({v:'calc'})"><span class="k">Calculadoras</span><span class="n">${CALCS.length} herramientas · flota, costos, seguridad</span></button>
      <button class="tile" onclick="go({v:'docs'})"><span class="k">Mis documentos</span><span class="n">${DOCS.length} guardados en este teléfono</span></button>
    </div>
    <h2 class="sec">Preguntas frecuentes</h2>
    <div class="list">${KB.faq.slice(0, 5).map((f, i) => `<button class="row" onclick="go({v:'item',sec:'faq',i:${i}})"><span class="t">${esc(f.pregunta)}</span></button>`).join("")}</div>
    <p class="small muted">${esc(KB.aviso)} Versión ${esc(KB.version)}.</p>`;
}

function renderSearch(q){
  const r = search(q);
  let h = `${backBtn()}<h2 class="view">“${esc(q)}”</h2>`;
  if (!r.length){
    h += `<div class="card"><p>No encontré nada sobre eso en la base guardada.</p><p class="muted small">Prueba con otra palabra (por ejemplo “gases”, “scoop”, “costo por metro”). Cuando haya internet, el modo IA podrá responder preguntas abiertas.</p></div>`;
  } else {
    const top = r[0];
    h += `<div class="card answer"><span class="label">Mejor respuesta · ${esc(top.e.sec === "docs" ? "Mis documentos" : secBy[top.e.sec].name)}</span><h3>${esc(titleOf(top.e.item) || top.e.item.nombre)}</h3>${top.e.sec === "docs" ? `<p>${hl((top.e.item.notas || top.e.item.texto || "").slice(0, 400), q)}</p><button class="btn ghost" onclick="go({v:'doc',id:'${top.e.id}'})">Abrir documento</button>` : fichaHtml(top.e.item)}</div>`;
    if (r.length > 1) h += `<h2 class="sec">También relacionado</h2><div class="list">${r.slice(1).map(({e}) => {
      const label = e.sec === "docs" ? "Mis docs" : secBy[e.sec].name, cls = e.sec === "ssoma" ? "s" : e.sec === "docs" ? "d" : "o";
      const click = e.sec === "docs" ? `go({v:'doc',id:'${e.id}'})` : `go({v:'item',sec:'${e.sec}',i:${e.i}})`;
      return `<button class="row" onclick="${click}"><span class="t"><span class="tag ${cls}">${esc(label)}</span>${esc(titleOf(e.item) || e.item.nombre)}</span><span class="d">${hl(snippet(e), q)}</span></button>`; }).join("")}</div>`;
  }
  view.innerHTML = h;
}

let glosCat = "todas", glosFilter = "";
function renderSection(key){
  const s = secBy[key];
  let h = `${backBtn()}<h2 class="view">${esc(s.name)}</h2><p class="lede">${esc(s.desc)}</p>`;
  if (key === "ssoma") h += `<div class="alert"><b>Derecho a retirarte</b><p>Si detectas un peligro de alto riesgo, puedes retirarte del área avisando de inmediato a tu supervisor (D.S. 024-2016-EM, art. 40).</p></div>`;
  if (key === "glosario"){
    const cats = ["todas", ...Object.keys(CAT).filter(c => s.items.some(x => x.categoria === c))];
    h += `<div class="field"><label for="gf">Filtrar términos</label><input id="gf" type="search" value="${esc(glosFilter)}" placeholder="Escribe parte del término"></div>
      <div class="chips">${cats.map(c => `<button class="chip" aria-pressed="${c === glosCat}" data-c="${c}">${c === "todas" ? "Todas" : CAT[c]}</button>`).join("")}</div><div class="list" id="gl"></div>`;
    view.innerHTML = h;
    const draw = () => {
      const f = norm(glosFilter);
      const items = s.items.map((x, i) => ({x, i})).filter(({x}) => (glosCat === "todas" || x.categoria === glosCat) && (!f || norm(x.termino + " " + x.sinonimos.join(" ")).includes(f))).sort((a, b) => a.x.termino.localeCompare(b.x.termino, "es"));
      $("#gl").innerHTML = items.length ? items.map(({x, i}) => `<button class="row" onclick="go({v:'item',sec:'glosario',i:${i}})"><span class="t">${esc(x.termino)}</span><span class="d">${esc(x.definicion)}</span></button>`).join("") : `<p class="empty">Ningún término coincide.</p>`;
    };
    $("#gf").addEventListener("input", e => { glosFilter = e.target.value; draw(); });
    view.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { glosCat = c.dataset.c; view.querySelectorAll(".chip").forEach(z => z.setAttribute("aria-pressed", z === c)); draw(); }));
    draw(); return;
  }
  h += `<div class="list">${s.items.map((x, i) => `<button class="row" onclick="go({v:'item',sec:'${key}',i:${i}})"><span class="t">${esc(titleOf(x))}</span><span class="d">${esc(x.contenido || x.resumen || x.respuesta || "")}</span></button>`).join("")}</div>`;
  view.innerHTML = h;
}

function renderItem(key, i){
  const x = secBy[key].items[i];
  view.innerHTML = `${backBtn()}<span class="tag ${key === "ssoma" ? "s" : "o"}">${esc(secBy[key].name)}${x.categoria ? " · " + esc(CAT[x.categoria] || x.categoria) : ""}</span><h2 class="view">${esc(titleOf(x))}</h2><div class="card">${fichaHtml(x)}</div>`;
}

/* ---------- calculadoras ---------- */
const CALCS = [
  {id: "mf", name: "Factor de acoplamiento", desc: "¿Me sobran o faltan volquetes?", src: ["MF"],
   f: [["camiones","Volquetes en operación",8],["palas","Equipos de carguío",2],["tc","Tiempo de carga por volquete (min)",4],["ciclo","Tiempo de ciclo del volquete (min)",22]],
   run: v => { const mf = (v.camiones * v.tc) / (v.palas * v.ciclo); const need = v.palas * v.ciclo / v.tc;
     return {big: fmt(mf), cls: Math.abs(mf - 1) <= 0.1 ? "ok" : "", text: (mf < 0.9 ? "Faltan volquetes: los equipos de carguío esperan." : mf > 1.1 ? "Sobran volquetes: habrá colas en el carguío." : "Flota equilibrada.") + ` Para MF = 1 necesitas unos ${fmt(need, 1)} volquetes.`}; }},
  {id: "reorden", name: "Punto de reorden", desc: "¿Cuándo pido más repuestos o insumos?", src: ["SME"],
   f: [["consumo","Consumo diario promedio (unid.)",40],["sigma","Desviación del consumo diario",8],["lt","Tiempo de entrega (días)",15],["z","Nivel de servicio (1,65 = 95%, 2,33 = 99%)",1.65]],
   run: v => { const ss = v.z * v.sigma * Math.sqrt(v.lt); const pr = v.consumo * v.lt + ss; return {big: fmt(Math.ceil(pr), 0) + " unid.", text: `Pide cuando el stock baje a ${fmt(Math.ceil(pr), 0)}. Incluye un stock de seguridad de ${fmt(Math.ceil(ss), 0)} unidades.`}; }},
  {id: "indices", name: "Índices de seguridad", desc: "IF, IS e IA del periodo", src: ["DS024"],
   f: [["acc","Accidentes incapacitantes + mortales",2],["dias","Días perdidos o cargados",45],["hh","Horas-hombre trabajadas",850000]],
   run: v => { const IF = v.acc * 1e6 / v.hh, IS = v.dias * 1e6 / v.hh, IA = IF * IS / 1000; return {big: `IA ${fmt(IA)}`, cls: IA === 0 ? "ok" : "bad", text: `IF = ${fmt(IF)} · IS = ${fmt(IS)} · IA = ${fmt(IA)}`}; }},
  {id: "aire", name: "Caudal de aire requerido", desc: "Aire para personas y equipos diésel (referencial)", src: ["DS024"],
   f: [["personas","Personas en la guardia (máx. simultáneo)",40],["alt","Altitud de la labor (msnm)",3200],["hp","HP de equipos diésel operando",450]],
   run: v => { const q = v.alt < 1500 ? 3 : v.alt < 3000 ? 4 : v.alt < 4000 ? 5 : 6; const qp = v.personas * q, qe = v.hp * 3, t = qp + qe;
     return {big: fmt(t, 0) + " m³/min", text: `Personas: ${fmt(qp, 0)} m³/min (${q} m³/min por persona a esa altitud). Equipos: ${fmt(qe, 0)} m³/min (3 m³/min por HP). Son ${fmt(t * 35.3147, 0)} CFM. Valores referenciales: verifica con el reglamento vigente y tu estudio de ventilación.`}; }},
  {id: "avance", name: "Costo por metro de avance", desc: "Galerías, cruceros, rampas", src: ["CMH_COSTOS"],
   f: [["mo","Mano de obra por disparo (US$)",180],["exp","Explosivos y accesorios (US$)",220],["mat","Materiales, aceros y EPP (US$)",95],["eq","Equipos: horas × costo horario (US$)",310],["gg","Gastos generales + utilidad (%)",20],["av","Avance efectivo por disparo (m)",2.8]],
   run: v => { const c = (v.mo + v.exp + v.mat + v.eq) * (1 + v.gg / 100); return {big: "US$ " + fmt(c / v.av) + "/m", text: `Costo por disparo: US$ ${fmt(c)}. Subir el avance efectivo baja directamente el costo por metro.`}; }},
  {id: "dilucion", name: "Ley diluida", desc: "Efecto del ancho de minado en vetas angostas", src: ["CMH_COSTOS"],
   f: [["ley","Ley de la veta (g/t)",12],["av","Ancho de veta (m)",0.8],["am","Ancho de minado (m)",1.2]],
   run: v => { const ld = v.ley * v.av / v.am; const dil = (v.am - v.av) / v.am * 100; return {big: fmt(ld) + " g/t", cls: dil > 40 ? "bad" : "", text: `Dilución: ${fmt(dil, 1)}%. Cada 10 cm menos de ancho de minado sube la ley a ${fmt(v.ley * v.av / Math.max(v.av, v.am - 0.1))} g/t.`}; }},
  {id: "corte", name: "Ley de corte", desc: "Ley mínima que paga su costo", src: ["SME"],
   f: [["costo","Costo total por tonelada (US$/TMS)",95],["precio","Precio del oro (US$/oz)",2400],["rec","Recuperación metalúrgica (%)",90],["venta","Costos de venta y refinación (US$/oz)",15]],
   run: v => { const gpt = v.costo / ((v.precio - v.venta) / 31.1035 * v.rec / 100); return {big: fmt(gpt) + " g/t", text: `Debajo de ${fmt(gpt)} g/t el mineral no paga su costo con estos supuestos.`}; }},
  {id: "van", name: "VAN y payback", desc: "Evaluar una inversión", src: ["SME"],
   f: [["inv","Inversión inicial (US$)",500000],["fc","Flujo de caja anual (US$)",160000],["n","Años",5],["r","Tasa de descuento (%)",10]],
   run: v => { let van = -v.inv; for (let t = 1; t <= v.n; t++) van += v.fc / Math.pow(1 + v.r / 100, t);
     let lo = -0.99, hi = 5, tir = NaN; const f = r => { let s = -v.inv; for (let t = 1; t <= v.n; t++) s += v.fc / Math.pow(1 + r, t); return s; };
     if (f(lo) * f(hi) < 0){ for (let k = 0; k < 100; k++){ const m = (lo + hi) / 2; f(m) > 0 ? lo = m : hi = m; } tir = (lo + hi) / 2 * 100; }
     return {big: "US$ " + fmt(van, 0), cls: van >= 0 ? "ok" : "bad", text: `${van >= 0 ? "La inversión crea valor." : "La inversión no se paga a esa tasa."} TIR ≈ ${fmt(tir, 1)}%. Payback ≈ ${fmt(v.inv / v.fc, 1)} años.`}; }},
  {id: "horario", name: "Costo horario de equipo", desc: "Propiedad + operación por hora y por tonelada", src: ["SME"],
   f: [["precio","Precio del equipo (US$)",450000],["res","Valor residual (%)",20],["vida","Vida útil (horas)",20000],["op","Costo de operación por hora (US$)",65],["prod","Productividad (t/h)",55]],
   run: v => { const prop = v.precio * (1 - v.res / 100) / v.vida; const tot = prop + v.op; return {big: "US$ " + fmt(tot) + "/h", text: `Propiedad: US$ ${fmt(prop)}/h. Costo por tonelada: US$ ${fmt(tot / v.prod)}/t. No incluye intereses ni seguros.`}; }},
];
function renderCalcs(){
  view.innerHTML = `<h2 class="view">Calculadoras</h2><p class="lede">Los valores de ejemplo son referenciales. Cámbialos por los de tu operación.</p>
   <div class="list">${CALCS.map(c => `<button class="row" onclick="go({v:'calcitem',id:'${c.id}'})"><span class="t">${esc(c.name)}</span><span class="d">${esc(c.desc)}</span></button>`).join("")}</div>`;
}
function renderCalc(id){
  const c = CALCS.find(z => z.id === id);
  let saved = {}; try { saved = JSON.parse(localStorage.getItem("calc-" + id) || "{}"); } catch(e){}
  view.innerHTML = `${backBtn()}<h2 class="view">${esc(c.name)}</h2><p class="lede">${esc(c.desc)}</p>
   <div class="card"><div class="fields">${c.f.map(([k, l, d]) => `<div class="field"><label for="c-${k}">${esc(l)}</label><input id="c-${k}" type="number" inputmode="decimal" step="any" value="${esc(saved[k] ?? d)}"></div>`).join("")}</div>
   <div id="out"></div>${srcHtml(c.src)}</div>`;
  const calc = () => {
    const v = {}; let ok = true;
    c.f.forEach(([k]) => { const n = parseFloat(String($("#c-" + k).value).replace(",", ".")); v[k] = n; if (!Number.isFinite(n)) ok = false; });
    try { localStorage.setItem("calc-" + id, JSON.stringify(v)); } catch(e){}
    if (!ok) { $("#out").innerHTML = `<div class="result bad"><span>Completa todos los campos con números.</span></div>`; return; }
    const r = c.run(v);
    $("#out").innerHTML = `<div class="result ${r.cls || ""}"><span class="big">${esc(r.big)}</span><span>${esc(r.text)}</span></div>`;
  };
  view.querySelectorAll("input").forEach(i => i.addEventListener("input", calc)); calc();
}

/* ---------- mis documentos ---------- */
function renderDocs(){
  view.innerHTML = `<h2 class="view">Mis documentos</h2>
   <p class="lede">Guarda manuales, PETS, procedimientos o fotos. Quedan solo en este teléfono y el buscador los incluye.</p>
   <div class="drop">
     <p><b>Agregar archivo o foto</b><br><span class="small muted">Texto (.txt, .md, .csv), PDF o imagen. Los PDF con texto se leen y se pueden buscar. En las fotos escribe notas o etiquetas para encontrarlas; la lectura automática de fotos llegará con el modo con internet.</span></p>
     <input id="file" type="file" accept=".txt,.md,.csv,.pdf,image/*" multiple>
   </div>
   <div class="list" id="dl"></div>`;
  $("#file").addEventListener("change", e => addFiles([...e.target.files]));
  $("#dl").innerHTML = DOCS.length ? DOCS.map(d => `<button class="row" onclick="go({v:'doc',id:'${d.id}'})"><span class="t"><span class="tag d">${esc(d.tipo)}</span>${esc(d.titulo || d.nombre)}</span><span class="d">${esc((d.notas || d.texto || "Sin texto. Agrega notas para poder buscarlo.").slice(0, 160))}</span></button>`).join("") : `<p class="empty">Aún no guardaste documentos. Prueba subiendo un PETS en PDF o la foto de un letrero de seguridad.</p>`;
}
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfText(file){
  if (!window.pdfjsLib){ await loadScript(PDFJS + "pdf.min.js"); await loadScript(PDFJS + "pdf.worker.min.js"); }
  const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const out = [];
  for (let p = 1; p <= Math.min(pdf.numPages, 300); p++){ const tc = await (await pdf.getPage(p)).getTextContent(); out.push(tc.items.map(i => i.str).join(" ")); }
  return out.join("\n\n");
}
async function addFiles(files){
  if (!DB.db){ toast("Este navegador no permite guardar archivos."); return; }
  for (const f of files){
    const d = {id: "d" + Date.now() + Math.random().toString(36).slice(2, 6), nombre: f.name, titulo: f.name.replace(/\.[^.]+$/, ""), fecha: Date.now(), tamano: f.size, notas: "", etiquetas: "", texto: "", tipo: "Archivo", blob: null};
    try {
      if (f.type.startsWith("image/")) { d.tipo = "Foto"; d.blob = f; }
      else if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") { d.tipo = "PDF"; d.blob = f; toast("Leyendo " + f.name + "…"); try { d.texto = await pdfText(f); } catch(e){ d.texto = ""; toast("No pude leer el texto del PDF. Se guardó igual; agrega notas."); } }
      else { d.tipo = "Texto"; d.texto = await f.text(); }
      await DB.put(d);
    } catch(e){ toast("No se pudo guardar " + f.name + ". Puede que falte espacio en el teléfono."); }
  }
  await loadDocs(); buildIndex(); toast(files.length === 1 ? "Documento guardado" : files.length + " documentos guardados"); renderDocs();
}
let confirmDel = null;
function renderDoc(id){
  const d = DOCS.find(z => z.id === id); if (!d) return go({v: "docs"}, false);
  let url = ""; try { if (d.blob && d.tipo === "Foto") url = URL.createObjectURL(d.blob); } catch(e){}
  view.innerHTML = `${backBtn()}<span class="tag d">${esc(d.tipo)} · ${new Date(d.fecha).toLocaleDateString("es-PE")}</span><h2 class="view">${esc(d.titulo || d.nombre)}</h2>
   <div class="card">
     ${url ? `<img class="thumb" src="${url}" alt="${esc(d.titulo)}">` : ""}
     <div class="field"><label for="dt">Título</label><input id="dt" value="${esc(d.titulo)}"></div>
     <div class="field"><label for="de">Etiquetas</label><input id="de" value="${esc(d.etiquetas)}" placeholder="Ej.: PETS, desatado, nivel 2350"></div>
     <div class="field"><label for="dn">Notas</label><textarea id="dn" rows="4" placeholder="Qué contiene, dónde aplica, qué te importa recordar">${esc(d.notas)}</textarea></div>
     <div class="chips"><button class="btn" id="save">Guardar cambios</button><button class="btn danger" id="del">Eliminar</button></div>
     <div id="confirm"></div>
   </div>
   ${d.texto ? `<h2 class="sec">Texto del documento</h2><div class="card"><p class="small" style="white-space:pre-wrap;max-height:420px;overflow:auto">${esc(d.texto.slice(0, 20000))}</p></div>` : ""}`;
  $("#save").onclick = async () => { d.titulo = $("#dt").value; d.etiquetas = $("#de").value; d.notas = $("#dn").value; await DB.put(d); await loadDocs(); buildIndex(); toast("Cambios guardados"); };
  $("#del").onclick = () => { $("#confirm").innerHTML = `<div class="alert"><b>¿Eliminar este documento?</b><p>Se borra de este teléfono y no se puede recuperar.</p><div class="chips"><button class="btn danger" id="yes">Sí, eliminar</button><button class="btn ghost" id="no">Cancelar</button></div></div>`;
    $("#yes").onclick = async () => { await DB.del(d.id); await loadDocs(); buildIndex(); toast("Documento eliminado"); go({v: "docs"}); };
    $("#no").onclick = () => { $("#confirm").innerHTML = ""; }; };
}

/* ---------- arranque ---------- */
(async () => {
  await DB.open(); await loadDocs(); buildIndex();
  try { history.replaceState({v: "home"}, ""); } catch(e){}
  go({v: "home"}, false);
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && !/claude\.ai|claudeusercontent/.test(location.host)) {
    try { navigator.serviceWorker.register("sw.js"); } catch(e){}
  }
})();
