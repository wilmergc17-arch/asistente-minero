name: APK Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Copiar la app web dentro del APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        # Sin el secreto se firma con una llave de prueba (al cambiar de llave hay que desinstalar la app una vez).
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/release.jks; else echo "::warning::Sin llave propia: APK firmado con llave de prueba"; fi

      - name: Compilar APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KS_ALIAS: minero
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk asistente-minero.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Asistente Minero para Android" --notes "Descarga asistente-minero.apk en tu teléfono Android e instálalo." --latest
          gh release upload apk asistente-minero.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: asistente-minero-apk
          path: asistente-minero.apk
