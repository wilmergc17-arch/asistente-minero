function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfText(file){
  if (!window.pdfjsLib){ await loadScript(PDFJS + "pdf.min.js"); await loadScript(PDFJS + "pdf.worker.min.js"); }
  const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const out = [];
  for (let p = 1; p <= Math.min(pdf.numPages, 300); p++){ const tc = await (await pdf.getPage(p)).getTextContent(); out.push(tc.items.map(i => i.str).join(" ")); }
  return out.join("\n\n");
}
async function addFiles(files){
  if (!DB.db){ toast("Este navegador no permite guardar archivos."); return; }
  for (const f of files){
    const d = {id: "d" + Date.now() + Math.random().toString(36).slice(2, 6), nombre: f.name, titulo: f.name.replace(/\.[^.]+$/, ""), fecha: Date.now(), tamano: f.size, notas: "", etiquetas: "", texto: "", tipo: "Archivo", blob: null};
    try {
      if (f.type.startsWith("image/")) { d.tipo = "Foto"; d.blob = f; }
      else if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") { d.tipo = "PDF"; d.blob = f; toast("Leyendo " + f.name + "…"); try { d.texto = await pdfText(f); } catch(e){ d.texto = ""; toast("No pude leer el texto del PDF. Se guardó igual; agrega notas."); } }
      else { d.tipo = "Texto"; d.texto = await f.text(); }
      await DB.put(d);
    } catch(e){ toast("No se pudo guardar " + f.name + ". Puede que falte espacio en el teléfono."); }
  }
  await loadDocs(); buildIndex(); toast(files.length === 1 ? "Documento guardado" : files.length + " documentos guardados"); renderDocs();
}

     <div id="confirm"></div>
   </div>
   ${d.texto ? `<h2 class="sec">Texto del documento</h2><div class="card"><p class="small" style="white-space:pre-wrap;max-height:420px;overflow:auto">${esc(d.texto.slice(0, 20000))}</p></div>` : ""}`;
  $("#readai").onclick = e => readWithAI(d, e.currentTarget);
  $("#askdoc").onclick = () => askAboutDoc(d);
  $("#save").onclick = async () => { d.titulo = $("#dt").value; d.etiquetas = $("#de").value; d.notas = $("#dn").value; await DB.put(d); await loadDocs(); buildIndex(); toast("Cambios guardados"); };
  $("#del").onclick = () => { $("#confirm").innerHTML = `<div class="alert"><b>¿Eliminar este documento?</b><p>Se borra de este teléfono y no se puede recuperar.</p><div class="chips"><button class="btn danger" id="yes">Sí, eliminar</button><button class="btn ghost" id="no">Cancelar</button></div></div>`;
    $("#yes").onclick = async () => { await DB.del(d.id); await loadDocs(); buildIndex(); toast("Documento eliminado"); go({v: "docs"}); };
    $("#no").onclick = () => { $("#confirm").innerHTML = ""; }; };
}

/* ---------- modo con internet: IA ---------- */
const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm";
const MODEL = "claude-opus-5-5";
const SYSTEM = `Eres el Asistente Minero, un asesor experto en minería subterránea peruana (minas auríferas de vetas como las de Pataz, con referencia a Consorcio Minero Horizonte), logística minera, CAPEX y OPEX, y sobre todo en seguridad, salud ocupacional y medio ambiente (SSOMA).

Cómo respondes:
- En español, con la terminología de la minería peruana (labor, tajo, echadero, guardia, contrata, TMS, PETAR, IPERC, PETS, ATS).
- Directo y práctico: primero la respuesta, luego el detalle. Usa listas cortas cuando ayuden. Usa unidades reales (US$/m, US$/TMS, g/t, m³/min).
- La seguridad va primero. Si la pregunta toca una tarea con riesgo, menciona los controles críticos (desatado, sostenimiento, ventilación, PETAR, bloqueo) aunque no te los pidan. Nunca sugieras saltarse un control para ganar producción.
- Cada turno trae fichas de la base de conocimiento de la app y documentos del usuario. Úsalos como fuente principal y di de cuál sale el dato. Si usas búsqueda web, prefiere fuentes oficiales peruanas (MINEM, OSINERGMIN, SUNAFIL, El Peruano) y cita la página.
- Para normas, cita el dispositivo legal y recuerda verificar el texto vigente. No inventes números de artículo ni cifras: si no estás seguro, dilo.
- Para ayudar a decidir: plantea las opciones, compáralas en costo, riesgo SSOMA, plazo y viabilidad, da una recomendación clara y di qué dato cambiaría la recomendación.
- Si te falta un dato de la operación, asume un valor razonable, dilo explícitamente y sigue.`;

const AI = {
  key(){ try { return localStorage.getItem("ia-key") || ""; } catch(e){ return ""; } },
  setKey(k){ try { k ? localStorage.setItem("ia-key", k) : localStorage.removeItem("ia-key"); } catch(e){} this.client = null; },
  web(){ try { return localStorage.getItem("ia-web") !== "0"; } catch(e){ return true; } },
  client: null,
  async getClient(){
    if (this.client) return this.client;
    const mod = await import(SDK_URL);
    const Anthropic = mod.default || mod.Anthropic;
    this.client = new Anthropic({apiKey: this.key(), dangerouslyAllowBrowser: true, maxRetries: 2});
    this.mod = mod;
    return this.client;
  },
  ready(){ return navigator.onLine && !!this.key(); },
};
/* messages: historial completo que se envía a la API (solo en memoria, nunca se edita).
   view: lo que se muestra; se guarda en el teléfono para releerlo, sin adjuntos. */
let CHAT = {messages: [], view: [], busy: false};
try { const s = JSON.parse(localStorage.getItem("ia-chat") || "null"); if (s && Array.isArray(s.view)) CHAT.view = s.view.map(m => ({...m, done: true, status: ""})); } catch(e){}
function saveChat(){ try { localStorage.setItem("ia-chat", JSON.stringify({view: CHAT.view.slice(-40)})); } catch(e){} }

function contextFor(q){
  const r = search(q).slice(0, 8);
  if (!r.length) return "";
  return r.map(({e}) => {
    if (e.sec === "docs"){ const d = e.item; return `<documento_usuario titulo="${d.titulo || d.nombre}">\n${(d.notas ? "Notas: " + d.notas + "\n" : "") + (d.texto || "").slice(0, 6000)}\n</documento_usuario>`; }
    const x = e.item, f = (x.fuentes || (x.fuente ? [x.fuente] : [])).map(id => KB.fuentes[id]?.titulo || id).join("; ");
    return `<ficha seccion="${secBy[e.sec].name}" titulo="${titleOf(x)}">\n${textOf(x)}\nFuente: ${f}\n</ficha>`;
  }).join("\n\n");
}
function mdLite(s){
  let h = esc(s);
  h = h.replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h3>$1</h3>").replace(/^# (.*)$/gm, "<h3>$1</h3>");
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/(?:^|\n)((?:\s*[-*•] .*(?:\n|$))+)/g, (m, block) => "\n<ul class=\"pts\">" + block.trim().split(/\n/).map(l => "<li>" + l.replace(/^\s*[-*•] /, "") + "</li>").join("") + "</ul>\n");
  h = h.replace(/(?:^|\n)((?:\s*\d+[.)] .*(?:\n|$))+)/g, (m, block) => "\n<ol class=\"steps\">" + block.trim().split(/\n/).map(l => "<li>" + l.replace(/^\s*\d+[.)] /, "") + "</li>").join("") + "</ol>\n");
  h = h.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h.split(/\n{2,}/).filter(p => p.trim()).map(p => /^\s*<(ul|ol|h3)/.test(p) ? p : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}

function renderIA(){
  const on = navigator.onLine, hasKey = !!AI.key();
  let h = `<h2 class="view">Preguntar a la IA</h2>`;
  if (!hasKey) {
    h += `<div class="card"><h3>Conecta la IA</h3>
      <p>La IA necesita tu clave de Claude. Se guarda solo en este teléfono y cada consulta se cobra a tu cuenta de Anthropic.</p>
      <ol class="steps"><li>Entra a <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> y crea una cuenta.</li><li>Carga saldo y, si quieres, pon un límite de gasto mensual.</li><li>Crea una clave (empieza con <code>sk-ant-</code>) y pégala aquí.</li></ol>
      <div class="field"><label for="ik">Clave de API</label><input id="ik" type="password" autocomplete="off" placeholder="sk-ant-…"></div>
      <button class="btn" id="iks">Guardar clave</button>
      <p class="small muted">Sin clave, el buscador sigue funcionando con la base guardada.</p></div>`;
    view.innerHTML = h;
    $("#iks").onclick = () => { const k = $("#ik").value.trim(); if (!/^sk-ant-/.test(k)) { toast("La clave debe empezar con sk-ant-"); return; } AI.setKey(k); toast("Clave guardada"); renderIA(); };
    return;
  }
  if (!on) h += `<div class="alert"><b>Sin conexión</b><p>La IA necesita internet. Mientras tanto, usa el buscador: responde con la base guardada y tus documentos.</p></div>`;
  h += `<div class="chips">${["Ayúdame a decidir entre dos opciones", "Analiza los riesgos de esta tarea", "¿Cómo bajo el costo por metro de avance?", "Arma un IPERC para desatado en un tajo"].map(s => `<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <div id="chat" class="chat"></div>
    <form id="askf" class="ask"><textarea id="ask" rows="3" placeholder="Escribe tu pregunta o describe la decisión que debes tomar" ${on ? "" : "disabled"}></textarea>
      <div class="chips"><button class="btn" id="askb" type="submit" ${on ? "" : "disabled"}>Preguntar</button>
      <label class="small"><input type="checkbox" id="iw" ${AI.web() ? "checked" : ""}> Buscar también en internet</label></div></form>
    <details class="small"><summary>Ajustes de la IA</summary><div class="chips" style="margin-top:8px">
      <button class="btn ghost" id="newc">Nueva conversación</button><button class="btn danger" id="delk">Quitar clave</button></div></details>`;
  view.innerHTML = h;
  drawChat();
  view.querySelectorAll(".chip[data-s]").forEach(c => c.onclick = () => { $("#ask").value = c.dataset.s + ": "; $("#ask").focus(); });
  $("#iw").onchange = e => { try { localStorage.setItem("ia-web", e.target.checked ? "1" : "0"); } catch(_){} };
  $("#newc").onclick = () => { CHAT = {messages: [], view: [], busy: false}; saveChat(); drawChat(); };
  $("#delk").onclick = () => { AI.setKey(""); toast("Clave eliminada de este teléfono"); renderIA(); };
  $("#askf").onsubmit = e => { e.preventDefault(); const q = $("#ask").value.trim(); if (q && !CHAT.busy) { $("#ask").value = ""; ask(q); } };
}
function drawChat(){
  const box = $("#chat"); if (!box) return;
  box.innerHTML = CHAT.view.length ? CHAT.view.map((m, i) => m.role === "note" ? `<p class="small muted">${esc(m.text)}</p>` : m.role === "user"
    ? `<div class="msg u">${esc(m.text)}${m.att ? `<span class="tag d">${esc(m.att)}</span>` : ""}</div>`
    : `<div class="msg a">${m.text ? mdLite(m.text) : `<p class="muted">${esc(m.status || "Pensando…")}</p>`}
        ${m.sources && m.sources.length ? `<p class="src">Fuentes web: ${m.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>`).join(" · ")}</p>` : ""}
        ${m.done && m.text && !m.err ? `<button class="btn ghost small" data-save="${i}">Guardar en Mis docs</button>` : ""}</div>`).join("")
    : `<p class="empty">Pregunta lo que necesites. La IA usa la base de la app, tus documentos y, si lo activas, internet.</p>`;
  box.querySelectorAll("[data-save]").forEach(b => b.onclick = () => saveAnswer(+b.dataset.save));
}
async function saveAnswer(i){
  const a = CHAT.view[i], q = CHAT.view.slice(0, i).reverse().find(m => m.role === "user");
  const d = {id: "d" + Date.now(), nombre: "Respuesta IA", titulo: (q ? q.text : "Respuesta IA").slice(0, 90), fecha: Date.now(), tamano: 0,
    notas: "", etiquetas: "IA aprendido", texto: a.text + (a.sources && a.sources.length ? "\n\nFuentes: " + a.sources.map(s => s.url).join(" ") : ""), tipo: "IA", blob: null};
  try { await DB.put(d); await loadDocs(); buildIndex(); toast("Guardado. Ya lo puedes buscar sin conexión."); } catch(e){ toast("No se pudo guardar en el teléfono."); }
}
function errMsg(e){
  const s = e && (e.status || (e.error && e.error.status));
  if (s === 401) return "La clave no es válida. Revísala en Ajustes de la IA.";
  if (s === 403) return "Tu cuenta no tiene permiso para este modelo o función.";
  if (s === 429) return "Demasiadas consultas seguidas o límite de gasto alcanzado. Espera un momento.";
  if (s === 400 && /credit|balance/i.test(String(e.message))) return "Tu cuenta de Anthropic no tiene saldo. Carga saldo en console.anthropic.com.";
  if (s >= 500) return "El servicio de IA está con problemas. Intenta de nuevo en unos minutos.";
  if (!navigator.onLine) return "Se perdió la conexión. Vuelve a intentar cuando tengas señal.";
  return "No se pudo completar la consulta: " + (e && e.message ? e.message : "error desconocido") + ".";
}
async function ask(q, attach){
  CHAT.busy = true;
  const ctx = contextFor(q);
  const content = [];
  if (attach) content.push(attach.block);
  content.push({type: "text", text: (ctx ? `Información de la app relacionada con la pregunta:\n${ctx}\n\n` : "") + `Pregunta: ${q}`});
  const base = CHAT.messages.length;
  if (!base && CHAT.view.length) CHAT.view.push({role: "note", text: "Nueva conversación: la IA no recuerda las respuestas anteriores a esta línea."});
  CHAT.messages.push({role: "user", content});
  CHAT.view.push({role: "user", text: q, att: attach ? attach.label : ""});
  const out = {role: "assistant", text: "", status: "Pensando…", sources: [], done: false};
  CHAT.view.push(out); drawChat(); scrollChat();
  const btn = $("#askb"); if (btn) btn.disabled = true;
  try {
    const client = await AI.getClient();
    const tools = AI.web() ? [{type: "web_search_20260209", name: "web_search", max_uses: 4, user_location: {type: "approximate", country: "PE"}}] : [];
    for (let round = 0; round < 4; round++){
      const stream = client.beta.messages.stream({
        model: MODEL, max_tokens: 16000, system: SYSTEM,
        thinking: {type: "adaptive"}, output_config: {effort: "medium"},
        betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
        tools, messages: CHAT.messages,
      });
      stream.on("text", t => { out.text += t; out.status = ""; drawChatThrottled(); });
      stream.on("contentBlock", b => {
        if (b.type === "server_tool_use") { out.status = "Buscando en internet…"; drawChatThrottled(); }
        if (b.type === "web_search_tool_result" && Array.isArray(b.content)) b.content.forEach(r => { if (r.url && !out.sources.some(s => s.url === r.url)) out.sources.push({url: r.url, title: r.title}); });
      });
      const msg = await stream.finalMessage();
      CHAT.messages.push({role: "assistant", content: msg.content});
      if (msg.stop_reason === "pause_turn") continue;
      if (msg.stop_reason === "refusal") out.text += (out.text ? "\n\n" : "") + "La IA no puede responder esta consulta. Reformúlala con más contexto operativo.";
      if (msg.stop_reason === "max_tokens") out.text += "\n\n(La respuesta se cortó por largo. Pide que continúe.)";
      break;
    }
  } catch(e){
    out.text = errMsg(e); out.err = true;
    CHAT.messages.length = base; // descarta el turno fallido para que el historial siga siendo válido
  }
  out.done = true; out.status = ""; CHAT.busy = false; saveChat(); drawChat(); scrollChat();
  if (btn) btn.disabled = false;
}
let _dt = 0;
function drawChatThrottled(){ const n = Date.now(); if (n - _dt > 120){ _dt = n; drawChat(); } }
function scrollChat(){ const m = view.querySelector(".msg:last-child"); if (m) m.scrollIntoView({block: "nearest"}); }

/* imagen → JPEG reducido en base64 (la API acepta hasta ~5 MB por imagen) */
async function imageBlock(blob){
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const data = c.toDataURL("image/jpeg", 0.85).split(",")[1];
  return {type: "image", source: {type: "base64", media_type: "image/jpeg", data}};
}
async function pdfBlock(blob){
  const buf = new Uint8Array(await blob.arrayBuffer()); let bin = "";
  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return {type: "document", source: {type: "base64", media_type: "application/pdf", data: btoa(bin)}};
}
async function docBlock(d){
  if (d.tipo === "Foto" && d.blob) return imageBlock(d.blob);
  if (d.tipo === "PDF" && d.blob) { if (d.blob.size > 30 * 1024 * 1024) throw new Error("El PDF pesa más de 30 MB"); return pdfBlock(d.blob); }
  return {type: "text", text: `<documento titulo="${d.titulo}">\n${(d.texto || "").slice(0, 150000)}\n</documento>`};
}
/* Leer con IA: transcribe y resume para que el documento quede buscable sin conexión */
async function readWithAI(d, btn){
  if (!AI.ready()) { toast(AI.key() ? "Necesitas conexión a internet." : "Primero conecta la IA en la pestaña IA."); return; }
  btn.disabled = true; btn.textContent = "Leyendo con IA…";
  try {
    const client = await AI.getClient();
    const block = await docBlock(d);
    const msg = await client.beta.messages.stream({
      model: MODEL, max_tokens: 16000, thinking: {type: "adaptive"}, output_config: {effort: "low"},
      betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
      system: "Extraes información de documentos y fotos de minería subterránea peruana. Respondes solo en el formato pedido, en español.",
      messages: [{role: "user", content: [block, {type: "text", text:
        "Lee este documento o foto. Devuelve exactamente tres secciones con estos encabezados:\nRESUMEN: 2 a 4 frases sobre qué es y para qué sirve, destacando cualquier riesgo o control de seguridad.\nETIQUETAS: 3 a 8 palabras clave separadas por comas, con términos de minería peruana.\nTEXTO: la transcripción fiel de todo el texto legible. Si es una foto sin texto, describe lo que se ve con detalle técnico (equipos, condiciones subestándar, señalización)."}]}],
    }).finalMessage();
    if (msg.stop_reason === "refusal") throw new Error("la IA no pudo procesar este archivo");
    const t = msg.content.filter(b => b.type === "text").map(b => b.text).join("\n");
    const part = k => { const m = t.match(new RegExp(k + ":\\s*([\\s\\S]*?)(?=\\n(?:RESUMEN|ETIQUETAS|TEXTO):|$)")); return m ? m[1].trim() : ""; };
    const res = part("RESUMEN"), tags = part("ETIQUETAS"), txt = part("TEXTO") || t;
    if (res) d.notas = (d.notas ? d.notas + "\n\n" : "") + "Resumen IA: " + res;
    if (tags) d.etiquetas = [d.etiquetas, tags].filter(Boolean).join(", ");
    if (d.tipo === "Foto" || !d.texto) d.texto = txt;
    await DB.put(d); await loadDocs(); buildIndex(); toast("Listo. Ahora lo puedes buscar sin conexión."); renderDoc(d.id);
  } catch(e){ toast(errMsg(e)); btn.disabled = false; btn.textContent = "Leer con IA"; }
}
async function askAboutDoc(d){
  if (!AI.ready()) { toast(AI.key() ? "Necesitas conexión a internet." : "Primero conecta la IA en la pestaña IA."); return; }
  try {
    const block = await docBlock(d);
    go({v: "ia"});
    const q = `Analiza el documento adjunto "${d.titulo}". Resume lo importante, señala riesgos SSOMA o incumplimientos que veas y dime qué acciones recomiendas.`;
    ask(q, {block, label: d.tipo + ": " + d.titulo});
  } catch(e){ toast(errMsg(e)); }
}

/* ---------- arranque ---------- */
(async () => {
  await DB.open(); await loadDocs(); buildIndex();
  try { history.replaceState({v: "home"}, ""); } catch(e){}
  go({v: "home"}, false);
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && !/claude\.ai|claudeusercontent/.test(location.host)) {
    try { navigator.serviceWorker.register("sw.js"); } catch(e){}
  }
})();
